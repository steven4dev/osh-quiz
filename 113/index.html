<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>營造業丙種職業安全衛生業務主管題庫【113年版精選471題】</title>
<style>
/* ── Reset & Base ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background .25s, color .25s;
}

/* ── Color tokens ─────────────────────────────────── */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: #dde1e7;
  --text: #1a1a2e;
  --text2: #5a6272;
  --primary: #2e7d32;
  --primary-dark: #1b5e20;
  --correct: #0f7a42;
  --correct-bg: #d4edda;
  --wrong: #c0392b;
  --wrong-bg: #fde8e6;
  --wrong-border: #e74c3c;
  --tag-bg: #e8f5e9;
  --tag-color: #2e7d32;
  --progress-track: #e0e5ec;
  --progress-fill: #2e7d32;
  --progress-done: #0f7a42;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --radius: 12px;
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3347;
  --text: #e8eaf0;
  --text2: #8a91a8;
  --primary: #66bb6a;
  --primary-dark: #4caf50;
  --correct: #2ecc71;
  --correct-bg: #0d3320;
  --wrong: #e74c3c;
  --wrong-bg: #3d1212;
  --wrong-border: #e74c3c;
  --tag-bg: #1a2d1e;
  --tag-color: #66bb6a;
  --progress-track: #22263a;
  --progress-fill: #66bb6a;
  --progress-done: #2ecc71;
  --shadow: 0 2px 8px rgba(0,0,0,.35);
}

/* ── Site nav ─────────────────────────────────────── */
.site-nav {
  background: var(--primary-dark);
  padding: 4px 16px;
  display: flex; gap: 4px; align-items: center;
  font-size: .76rem;
}
.site-nav a, .site-nav .cur {
  color: rgba(255,255,255,.75);
  text-decoration: none;
  padding: 2px 8px; border-radius: 4px;
  white-space: nowrap;
}
.site-nav a:hover { color: #fff; background: rgba(255,255,255,.15); }
.site-nav .cur { color: #fff; font-weight: 700; background: rgba(255,255,255,.2); }
.site-nav .sep { color: rgba(255,255,255,.3); }

/* ── Sticky top wrapper ───────────────────────────── */
.sticky-top {
  position: sticky; top: 0; z-index: 100;
}

/* ── Header ───────────────────────────────────────── */
header {
  background: var(--primary);
  color: #fff;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.2);
}
header h1 {
  font-size: 1rem; font-weight: 700; flex: 1;
  line-height: 1.3;
}
header h1 small {
  font-size: .72rem; font-weight: 400; opacity: .8;
  white-space: nowrap;
}
#theme-btn {
  background: rgba(255,255,255,.2); border: none;
  border-radius: 8px; padding: 6px 10px;
  cursor: pointer; color: #fff; font-size: 1.1rem;
  transition: background .2s;
}
#theme-btn:hover { background: rgba(255,255,255,.35); }

/* ── Progress bar ─────────────────────────────────── */
.progress-section {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.progress-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 5px;
}
.progress-label {
  font-size: .82rem; font-weight: 600; color: var(--text2);
}
.accuracy-label {
  font-size: .82rem; font-weight: 700; color: var(--correct);
}
.progress-pct {
  font-size: .82rem; font-weight: 700; color: var(--primary);
  transition: color .4s;
}
.progress-pct.done { color: var(--correct); }
.progress-track {
  height: 8px; border-radius: 99px;
  background: var(--progress-track);
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 99px;
  background: var(--progress-fill);
  width: 0%;
  transition: width .4s ease, background .4s;
}
.progress-fill.done { background: var(--progress-done); }

/* ── Controls ─────────────────────────────────────── */
.controls {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.controls select, .controls input {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: .95rem;
  background: var(--surface2);
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.controls select:focus, .controls input:focus { border-color: var(--primary); }
#ch-select { flex: 0 0 auto; max-width: 100%; }
#search-input { flex: 1; min-width: 160px; }
#stats {
  font-size: .82rem; color: var(--text2);
  white-space: nowrap;
}
#clear-wrong-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--wrong-bg); color: var(--wrong);
  border: 1px solid var(--wrong-border); border-radius: 8px;
  cursor: pointer; display: none;
}
#clear-wrong-btn:hover { opacity: .85; }
#reset-progress-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer;
}
#reset-progress-btn:hover { border-color: var(--primary); color: var(--primary); }
#export-btn, #import-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer;
}
#export-btn:hover { border-color: #0f7a42; color: #0f7a42; }
#import-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ── Main grid ────────────────────────────────────── */
main {
  max-width: 1300px; margin: 0 auto;
  padding: 16px 16px 60px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
@media (min-width: 1024px) {
  main { grid-template-columns: 1fr 1fr; }
}

/* ── Question card ────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
  border-left: 4px solid var(--border);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .2s, box-shadow .2s;
  position: relative;
}
.card.was-wrong { border-left-color: var(--wrong-border); }
.card.answered-ok { border-left-color: var(--correct); }
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }

.card-header {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.q-num {
  font-weight: 700; color: var(--primary); font-size: .9rem;
  white-space: nowrap; margin-top: 2px;
}
.ch-tag {
  font-size: .72rem; font-weight: 600;
  background: var(--tag-bg); color: var(--tag-color);
  padding: 2px 7px; border-radius: 20px;
  white-space: nowrap; line-height: 1.6;
  max-width: 160px; overflow: hidden; text-overflow: ellipsis;
}
.ch-tag.numeric { background: #fff3e0; color: #e65100; }
.ch-tag.multiple { background: #e8eaf6; color: #3949ab; }

.q-text {
  font-size: 1rem; font-weight: 500; color: var(--text);
  line-height: 1.55;
}

/* Options */
.options { display: flex; flex-direction: column; gap: 7px; }
.opt-btn {
  width: 100%; text-align: left;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .93rem; cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
  line-height: 1.5;
  min-height: 44px;
}
.opt-btn:hover:not(:disabled) {
  background: var(--tag-bg); border-color: var(--primary);
  transform: translateX(2px);
}
.opt-btn:disabled { cursor: default; }
.opt-btn.correct {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct);
  font-weight: 600;
}
.opt-btn.wrong {
  background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong);
}
/* 反向題：正確答案 = 唯一錯誤選項，黃底刪除線 */
.opt-btn.correct-neg {
  background: #fffde7; border-color: #f9a825; color: #5d4037;
  font-weight: 600;
  text-decoration: line-through;
  text-decoration-color: #e65100;
  text-decoration-thickness: 2px;
}
[data-theme="dark"] .opt-btn.correct-neg {
  background: #3e2f00; border-color: #f9a825; color: #ffe082;
  text-decoration-color: #ffb300;
}

/* Result row */
.result-row {
  display: none; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 8px;
  font-size: .9rem; font-weight: 600;
  flex-wrap: wrap;
}
.result-row.show { display: flex; }
.result-row.ok { background: var(--correct-bg); color: var(--correct); }
.result-row.ok.neg { background: #fffde7; color: #e65100; }
[data-theme="dark"] .result-row.ok.neg { background: #3e2f00; color: #ffb300; }
.result-row.bad { background: var(--wrong-bg); color: var(--wrong); }
.result-row.multi { background: #e8eaf6; color: #3949ab; }

/* ── Multiple-select: checkboxes + submit ──────────── */
.multi-options { display: flex; flex-direction: column; gap: 7px; }
.multi-btn {
  width: 100%; text-align: left;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .93rem; cursor: pointer;
  transition: background .15s, border-color .15s;
  line-height: 1.5; min-height: 44px;
  display: flex; align-items: center; gap: 8px;
  position: relative;
}
.multi-btn::before {
  content: '';
  width: 18px; height: 18px; flex-shrink: 0;
  border-radius: 4px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  transition: background .15s, border-color .15s;
}
.multi-btn.selected { border-color: var(--primary); background: var(--tag-bg); }
.multi-btn.selected::before { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 3px #fff; }
.multi-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--tag-bg); }
.multi-btn:disabled { cursor: default; }
.multi-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); font-weight: 600; }
.multi-btn.correct::before { background: var(--correct); border-color: var(--correct); box-shadow: inset 0 0 0 3px #fff; }
.multi-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
.multi-btn.wrong::before { background: var(--wrong); border-color: var(--wrong); box-shadow: inset 0 0 0 3px #fff; }
.multi-btn.missed { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); font-weight: 600; opacity: .7; }
.multi-btn.missed::before { background: var(--correct); border-color: var(--correct); box-shadow: inset 0 0 0 3px #fff; }
.multi-submit {
  margin-top: 4px; padding: 9px 18px;
  border-radius: 8px; border: none;
  background: var(--primary); color: #fff;
  font-size: .9rem; font-weight: 600; cursor: pointer;
  transition: background .15s, opacity .15s;
  align-self: flex-start;
}
.multi-submit:hover { opacity: .87; }
.multi-submit:disabled { opacity: .4; cursor: default; }

.retry-btn {
  margin-left: auto; padding: 4px 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; font-size: .82rem; color: var(--text2);
}
.retry-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ── Empty state ──────────────────────────────────── */
#empty {
  display: none;
  grid-column: 1 / -1;
  text-align: center; padding: 60px 20px;
  color: var(--text2); font-size: 1.1rem;
}

/* ── Scrollbar ─────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Mobile tweaks ────────────────────────────────── */
@media (max-width: 600px) {
  header h1 { font-size: .9rem; }
  .q-text { font-size: .97rem; }
  .opt-btn { font-size: .91rem; padding: 11px 12px; min-height: 52px; }
  .controls { flex-wrap: wrap; }
  #ch-select { width: 100%; }
  #search-input { flex: 1 1 140px; }
  .progress-section { padding: 6px 12px 8px; }
}
</style>
</head>

<div class="sticky-top">

<main id="main-grid">

eric":false,"isMultiple":false,"isNegative":true},{"id":32,"text":"有機溶劑、粉塵、缺氧等作業主管之資格如何?","options":["由安全衛生人員兼任即可","高中畢業即可","需具備有機溶劑、粉塵、缺氧等有害作業主管安全衛生教育訓練合格","由老闆任意指定即可。"],"answer":3,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":33,"text":"勞動檢查機構辦理下列何種檢查、鑑定、分析等事項，依現行勞動法令規定，得由中央主管機關所屬勞動及職業安全衛生研究所或其他學術、研究機構提供必要之技術協助?","options":["危險性機械或設備檢查","處理勞動條件秘密申訴案件","職業災害檢查","勞動基準法令規定事項之檢查"],"answer":3,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":34,"text":"依職業安全衛生法規定，下列何者為受僱從事工作獲致工資者?","options":["勞工","雇主","事業單位","承攬人。"],"answer":1,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":35,"text":"依勞動檢查法規定，勞動檢查機構於受理勞工申訴後，應儘速就其申訴內容派勞動檢查員實施檢查，並於幾日內將檢查果通知申訴人?","options":["7","15","14","10"],"answer":3,"chapter":"第二章 職業安全衛生相關法規","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":36,"text":"職業安全衛生教育訓練規則，係依下列何種法規訂定?","options":["職業安全衛生法","工會法","勞動基準法","勞工保險條例"],"answer":1,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":37,"text":"下列何者雇用勞工之事業，不適用職業安全衛生法?","options":["水電燃氣業","環境衛生服務業","營造業","未支薪家族事業。"],"answer":4,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":38,"text":"有關使用合梯作業，下列敘述何者錯誤?","options":["有安全防滑梯面","梯腳與地面夾角任何角度皆可，且兩梯腳間無需繫材扣牢","合梯材質不可有顯著損傷","合梯須有堅固知構造"],"answer":2,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":39,"text":"依職業安全衛生設施規則規定，在通風及換氣部分，雇主對於勞工經常作業之室內作業場所，其窗戶及其他開口部分等可直接與大氣相通之開口部分面積，應為地板面積多少比例以上?","options":["1:20","1:50","1:40","1:30。"],"answer":1,"chapter":"第二章 職業安全衛生相關法規","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":40,"text":"依職業安全衛生法規定，雇主如未對勞工施以從事工作與預防災變所必要之安全衛生教育及訓練，經通知限期改善，屆期未改善者，可處新台幣多少元之罰緩?","options":["3萬元以上15萬元以下","15萬元以上30萬元以下","10萬元以上30萬元以下","6萬元以上9萬元以下"],"answer":1,"chapter":"第二章 職業安全衛生相關法規","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":41,"text":"依職業安全衛生管理辦法規定，雇主依規定實 ":2,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":170,"text":"主管人員藉觀察屬下工作步驟，分析作業實況，以發掘作業場所潛在的危險及可能的危害，經協商、討論、修正而建立安全的工作方法，稱為下列何者？","options":["安全作業標準","安全觀察","風險管理","工作安全分析"],"answer":4,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":171,"text":"經由工作安全分析，建立正確工作程序，以消除工作時的不安全行為，設備與環境，確保工作安全的標準，稱為下列何者？","options":["安全作業標準","安全觀察","風險管理","工作安全分析"],"answer":1,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":172,"text":"下列工作安全分析中何者為最後一個程序？","options":["尋求避免危害及可能發生事故的方法","決定要分析的工作","找出危害及可能發生的事故","將工作分解成若干步驟"],"answer":1,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":173,"text":"在降低風險的控制措施中，緊急應變屬下列何者？","options":["工程控制措施","消除","管理控制措施","取代"],"answer":3,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":174,"text":"考量降低風險之控制措施時，下列順序何者正確？《A.工程控制B.管理控制C.消除D.取代》","options":["DCBA","ABCD","CDAB","ACDB。"],"answer":3,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":175,"text":"在降低風險控制措施中，以低電壓電氣設備取代高電壓電器設備，屬於下列何者？","options":["管理控制措施","工程控制措施","消除","取代"],"answer":4,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":176,"text":"當風險已被降低至可被容忍的程度，又稱之為何？","options":["高度風險","可接受風險","低度風險","中度風險"],"answer":2,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":177,"text":"風險等級之分析方法不包刮下列何者？","options":["定時分析","定性分析","半定量分析","定量分析"],"answer":1,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":178,"text":"輪班作業係針對下列何種暴露要件進行控制？","options":["接受者","輸送途徑","監督者","汙染源"],"answer":1,"chapter":"第五章 風險評估","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":179,"text":"事業單位招人承攬時，其承攬人就承攬部份負雇主之責任，原事業單位就職業災害補償部分之責任為何?","options":["仍應與承攬人負連帶責任","依承攬契約決定責任","依災害性質決定責任","可不負責任"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":180,"text":".下列有關承攬商進廠區管制之敘述，何者正確?","options":["各承攬商應事先提報預定進場人員之名單，詳列姓名、年齡、住址、電話、投保資料、教育訓練資格等，以便進場時逐一核對確","吊掛荷重在三公噸以上之起重機須進場時檢附合格證，其餘機具經外觀檢視完整者即可進場","承攬商先行提報聘僱工程師名單，經確認符合資格，該等人員進場時不須再予檢視","承攬商預先提報採用符合CNS4750規格之施工架，材料進場時可不需再予檢"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":181,"text":"兩個以上之事業單位分別出資共同承攬時，防止職業災害之雇主責任應由下列何者負責？","options":["此兩個事業單位互推1人為代表人","兩個事業單位一起負責","出資較多的事業單位","勞工人數較多的事業單位"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":182,"text":"進場施工危害告之應如何實施?","options":["於交付承攬時，應以書面告知作業內容及工作場所可能存在之危害狀況","由承攬人於作業前實施危害調查後，將所發掘之危害內容，以書面告知原事業單位","於協議組織告知各相關承攬人現場安全設施之潛在危害","於工地巡視時由工地主任告知承攬人所承攬工作項目之潛在危害"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":183,"text":"下列何者不是職業安全衛生法規定協議組織應協議之事項？","options":["承攬人勞工薪資","從事動火、高架、開挖、爆破、高壓電活線等危險作業之管制","對進入密閉空間、有害物質作業等作業環境之作業管制","電氣機具入廠管制"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":184,"text":"下列有關承攬管理之敘述，何者錯誤?","options":["原事業單位應督導現場作業各級承攬人實施安全衛生設施之設置，使用及維護","原事業單位應督導各工項分包承攬人就使用之機具設備進行必要之檢點，維修保養等作業，以維正常功能","各工項分包承攬人依據原事業單位核可之分項工程作業計畫施工並自主辦理檢查，原事業單位則就非屬承攬範圍實施檢查","原事業單位應依施工進度需要，分別通知相關承攬人進場作業"],"answer":3,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":185,"text":"下列何者為承攬人無法改善必須退場之時機?","options":["發生虛驚事故時","安全衛生缺失計點達罰款上限額度時","承攬人履約過程出現重大瑕疵，無法繼續履行契約時","分項工程作業計畫於危險性工作場所審查時未通過"],"answer":3,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":186,"text":"小邱營造公司將維修工程交由一定好工程公司承攬時，請問小邱營造公司應於何時告知一定好工程公司有關其事業工作環境、危害因素暨職業安全衛生法及有關安全衛生規定應採取之措施？","options":["事前告知","動工後","發生災害後","無須告知"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":187,"text":"原事業單位勞工與承攬人勞工共同作業時，下列何者錯誤？","options":["提供機械、設備及器具供承攬人使用，並實施定期檢查","指定自己的勞工為工作場所負責人","指定承攬人勞工為工作場所負責人","協助承攬人辦理教育訓練"],"answer":3,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":188,"text":"下列何者為職業安全衛生法所稱之共同作業？","options":["事業單位與承攬人、再承攬人所僱用之勞工於同一時間、同一工作場所從事工作","事業單位於其工作場所內之空地，劃出一部分供承攬人使用無相關干擾","事業單位未參與施工，僅於完工後派員驗收","事業單位與承攬人各自獨自作業，相互間無危害相關連"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":189,"text":"下列有關進廠施工協議組織運作方式之敘述，何者正確?","options":["原事業單位得篩選參加協議組織之成員","起重吊掛作業應由原事業單位派員指揮，以統一作業方式、順序及安全防護設施，可不需納入協議組織管理","協議組織之運作由原事業單位事需要實施，無關乎工地運作","施工過程原事業單位應召集各承攬人及相關人員進行協議"],"answer":4,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":190,"text":"有關危害告知，下列何者正確？","options":["可以口頭方式告知","得以承攬人承諾書替代危害告知","承攬人就其承攬之全部或一部分交付再承攬時，承攬人無須告知再承攬人","需以書面召開協調會議並做成紀錄"],"answer":4,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":191,"text":"依職業安全衛生法規定，事業單位以其事業之全部或一部分交付承攬時，下列何者不是應於事前告知該承攬人之事項？","options":["外勞雇用比例","危害因素","有關安全衛生規定應採取措施","事業工作環境"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":192,"text":"某工程由甲營造公司承建，甲營造公司再將其中之施工架組配及拆除交由乙公司施作，則甲公司就職業安全衛生法而言是何者？","options":["業主","原事業單位","承攬人","再承攬人"],"answer":2,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":193,"text":"依職業安全衛生法規定，事業單位與承攬人、再承攬人分別僱用勞工共同作業時，應由何者指定工作場所負責人，擔任統一指揮及協調工作？","options":["承攬人","再承攬人","原事業單位","檢查機構"],"answer":3,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":194,"text":"甲公司將其事業交付乙公司承攬，並提供移動式起重機供該乙公司使用，依職業安全衛生管理辦法規定，原則上該起重機應由下列何者實施自動檢查？","options":["甲公司","委託代檢機構","乙公司","甲、乙公司推派代表"],"answer":1,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":195,"text":"事業單位擬將事業一部分交付承攬，下列何者為選擇承攬人之優先考量條件？","options":["安全衛生教育訓練時數","安全衛生管理人數量","安全衛生經費比例","安全衛生績效"],"answer":4,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":196,"text":"依職業安全衛生法規定，事業單位以其事業交付承攬時，原事業單位仍應就下列何者與承攬人負連帶責任？","options":["刑事處分","職業災害補助","工時損失","職業災害補償"],"answer":4,"chapter":"第六章 承攬管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":197,"text":"依職業安全衛生法規定，中央主管機關指定機械、設備或器具，其構造性、能及防護非符合安全標準者，不得產製運出廠場、輸入或供應，下列何者非指定之對象？","options":["移動式起重機","防爆電器設備","動力衝剪機械","動力堆高機"],"answer":1,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":198,"text":"甲公司辦理社區排水改善工程，為工區警衛及交通引導工作需要，擬以勞務承攬方式進用8名勞工，採購文件中應載明投標廠商辦理事項為何，方為完整正確?","options":["採購契約範本、施工綱要規範、安全衛生工作守則","職業安全衛生法規、施工安全衛生規範、業主契約文件","工作內容、工作場所特性、安全設施及個人防護具設置需求、進場勞工管理事項等","標單、契約書、僱用證明、勞保名冊"],"answer":3,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":199,"text":"依變更管理技術指引之要求，變更管理之作業流程中，下列何者應優先執行？","options":["成效確認","界定變更管制範圍","變更之申請","諮詢"],"answer":2,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":200,"text":"下列有關工程監造單位應辦理事項之敘述，何者錯誤?","options":["於施工中、驗收或使用前，分別實施必要之查核，以確認其符合性:相關執行紀錄自查核日起保存一年","配合施工程序設定安全衛生查核點，據以執行","設置監督查核之管理組織、配置適當數量符合資格之查核人員","訂定工程監督查核計畫以於施工過程實施監督查核"],"answer":1,"chapter":"第七章 採購及變更管理","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":201,"text":"下列有關施工機具採購之敘述，何者錯誤?","options":["採購契約中應規定供應商應提供機具組裝、測試所需之機具設備及專業人力","採購契約明訂廠商應提出機具組裝、測試之安全防護設施、應使用安全防護具等","得標廠商應自行考量機具設備送抵工地方式，採購規範中無需特別予以規定","隧道開挖機等特殊機具，應於採購規範中訂明應辦理試運轉及必要之功能驗證測試，以為驗收之依據"],"answer":3,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":202,"text":"下列有關營造廠商辦理施工安全設施採購之敘述，何者錯誤?","options":["應由各分項工程承攬商採購設置以明全責","配合施工進度需要，分批採購符合法規規格之設施","事先估算所需各類設施數量，依規定開具詳細規格，訂定開口契約，配合工程進度進場安裝","依據施工方法、程序，選用安全設施之類型、數量，分批採購。"],"answer":1,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":203,"text":"下列有關施工機具採購之敘述，何者錯誤?","options":["隧道開挖機等特殊機具，應於採購規範中訂明應辦理試運轉及必要之功能驗證測試，以為驗收之依據","採購契約應自行考量機具組裝、測試之安全防護設施、應使用安全防護具等","得標廠商應自行考量機具設備送抵工地之方式，採購規範中無需特別予以規定","採購契約中應規定供應商提供機具組裝、測試所需之機具設備及專業人力。"],"answer":3,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":204,"text":"下列何者較不常是修繕管理之危害因素？","options":["對工作場所之熟悉度","多屬承攬性作業","對修繕技術之熟悉度","作業期間短暫"],"answer":3,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":205,"text":"下列有關營造廠商辦理施工安全設施採購之敘述，何者錯誤?","options":["依據施工法、程序，選用安全設施之類型、數量，分批採購","配合施工進度需要，分批採購符合法規規格之設施","事先估算所需各類設施數量，依規定開具詳細規格，訂定開口契約，配合工程進度進場安裝","應由各分項工程承攬商採購設置以明權責。"],"answer":4,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":206,"text":"下列有關工程採購管理實施範圍之敘述，何者錯誤?","options":["工程採購實施前，應確實審核該標案之各項圖說、標單等招標文件是否詳實","編列採購預算應確實將各工作項目之作業內容、方法、數量等核算明確，編列合理費用","因應工程需要得定投標廠商資格要件，將廠商之相關工程經歷、履約紀錄等納入規定","工程採購管理應自招標受理廠商投標文件之審核開始"],"answer":4,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":207,"text":"營造工程職業安全衛生設施之採購，應如何辦理?","options":["發包交由專業廠商安裝，無涉使用該等設施之承包商管理責任","配合工程進展於作業前設置完妥，施工過程隨時檢視維護，以維持正常功能","於分項工程採購契約中明定各分包承攬商應自行負責工作所需之安全衛生設施，無須原事業單位費心管理","原事業單位購置材料交由臨時點工安裝"],"answer":2,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":208,"text":"下列何者非訂定變更管理之主要考量項目？","options":["事業單位形象","本身實際需求","職業安全衛生管理系統相關規範","最新安全衛生法規"],"answer":1,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":209,"text":"上包商參與工程競技標時，為壓低標價或便宜行事，往往將安全衛生經費的編列計算方式列計算方式?","options":["轉嫁下包商分攤","量化計量計價","一式計價","自行吸收"],"answer":3,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":210,"text":"機關於工程規劃、設計時，應要求規劃、設計單位將安全衛生經費明細表等作為招標文件，納入契約執行，下列何者不包括在內?","options":["規劃安全衛生注意事項、圖說","施工安全衛生規範","職業安全衛生法規","逾期罰款"],"answer":4,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":211,"text":"機關於工程規劃、設計時，應要求規劃、設計單位經費明細表等作為招標文件，納入契約執行，下列何者不包含在內?","options":["職業安全衛生法規","規劃安全衛生注意事項、圖說","施工安全衛生規範","逾期罰款"],"answer":4,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":212,"text":"下列有關變更管理實施方式之敘述，何者錯誤?","options":["變更內容應通知施工人員並經啓用前檢查確認機具設備、設施等均已更設完成，方得施工","擬訂變更計畫後應實施風險評估","應評估變更後可能出現之風險，擬訂適當對策","應將變更後之施工圖、施工計畫等文件發交施工團隊簽收後施工。"],"answer":4,"chapter":"第七章 採購及變更管理","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":213,"text":"依危險性工作場所審查及檢查辦法 er":"第十章 機械安全管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":276,"text":"以氧氣乙炔切割型鋼時，連接切割器之橡皮管竄出火苗，應優先採行措施為何?","options":["關閉氧氣乙炔鋼瓶","儘速離開","使用滅火器滅火","取水滅火。"],"answer":1,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":277,"text":"下列何者非屬易發生火災之作業?","options":["化學作業","電銲作業","施工架組配作業","油漆作業"],"answer":3,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":278,"text":"隧道內有下列何種狀況時，使用之馬達用電設備、照明燈等應有防爆性能?","options":["崩塌","可燃性氣體","落磐","湧水現象。"],"answer":2,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":279,"text":"雇主金屬之熔接、熔斷或加熱等作業所需使用可燃性氣體及氧氣之容器，下列敘述何者錯誤?","options":["容器不得設置於通風或換氣不充分之場所","容器應橫放，便於地面滾動","容器使用時，應留置專用板手於容器閥柄上","保持容器之溫度於攝氏40度以下。"],"answer":2,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":280,"text":"雇主對於從事灌注、卸收或儲藏危險物於槽車等作業，下列敘述何者錯誤?","options":["使用槽車從事灌注作業前，槽車之引擎不應熄火","作業結束後，確認不致因引擎啟動而發生危害後，始得發動","使用槽車從事灌注作業前，應設置適當之輪檔","使用軟管從事可燃性氣體之灌注時，應事先確定軟管結合部分已確實連接牢固"],"answer":1,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":281,"text":"下列何者非屬可燃性氣體?","options":["氫","乙炔","乙醚","丙烷。"],"answer":3,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":282,"text":"油類發生火災不可如何處理？","options":["用水澆滅","用砂撲滅","用滅火器噴滅","以上皆非。"],"answer":1,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":283,"text":"由木材、紙張、煤炭、橡膠及垃圾等一般可燃性固體物質所引起之火災係屬下列何類?(甲木乙油丙電丁禁水性物質(金屬、鈉鋰鉀等等))","options":["丁類火災","乙類火災","甲類火災","丙類火災。"],"answer":3,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":284,"text":"下列何者為爆材庫設置及管理之正確作為?","options":["爆炸物管理員應定期檢查、清點爆炸物","爆材庫應上鎖，並於夜間派員看守","領用爆炸物數量不需點收，多餘部分當日繳回即可","爆材庫之設置應依據營造安全衛生設施標準規定申請核准。"],"answer":1,"chapter":"第十一章 火災爆炸危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":285,"text":"油漆桶發生火災，不宜使用下列何種滅火劑？"," "在道路施工時，為防止工作人員遭車輛撞擊之交通事故，對於出入口之防護措施，下列何者有誤？","options":["設置警告標示","工地大門置交通引導人員","管制非工作人員不得進入","各包商之車輛一律停放於工地現場"],"answer":4,"chapter":"第十三章 倒塌崩塌危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":338,"text":"堆高機行駛在速度上？","options":["減速慢行","沒有規定","隨自己的感覺","無人看到時就快，有人就慢"],"answer":1,"chapter":"第十三章 倒塌崩塌危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":339,"text":"如何防止人員被撞的危害？","options":["人車分道","加保意外險理賠金額","發放防撞衣","狂按喇叭"],"answer":1,"chapter":"第十三章 倒塌崩塌危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":340,"text":"氧氣乙炔鋼瓶敘述何者有誤？","options":["使用時固定","橫躺","不可超過攝氏40度","分開存放。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":341,"text":"依職業安全衛生管理辦法規定，雇主對化學設備或其附屬設備，應就規定事項多久實施定期檢查1次？","options":["每日","每月","每年","每2年。"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":342,"text":"依職業安全衛生管理辦法規定，局部排氣裝置應多久定期實施檢查1次？","options":["每月","每三個月","每半年","每年。"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":343,"text":"通風不充份之場所，使用氬、二氧化碳或氦等從事熔接作業時，應予________，以保持作業場所空氣中氧氣含量在百分之十八以上。","options":["備妥滅火器","適當換氣","員監視作業","以上皆是"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":344,"text":"依缺氧症預防規則之規定，雇主使勞工從事缺氧危險作業時，應指派幾人以上監視人員，隨時監視作業狀況？","options":["不需派員","1人","2人","無規定。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":345,"text":"從事缺氧危險作業時，應予","options":["適當換氣，以保持該作業場所空氣含氧量百分之十八以上","可不必通風換氣，打開人孔蓋，自然通風即可","只要測定空氣含氧量18％以上即可，不必通風換氣","為防止爆炸、氧化或作業上有顯著因難，可不必實施換氣，戴防毒面具即可。"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":346,"text":"依危害性化學品標示及通識規則規定，危害圖示為「骷顱頭」有可能為下列何種危害性化學品？","options":["致癌物質","生殖毒性物質","呼吸道過敏物質","急毒性物質"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":347,"text":"依危害性化學品標示及通識規則規定，致癌物質之危害圖式，為下列何者？","options":["驚歎號","骷顱頭","癌細胞","人頭及胸腔。"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":348,"text":"依危害性化學品標示及通識規則規定，裝有危害物質之容器在多少毫升(mL)以下者，得僅標示名稱、危害圖示及警示語？","options":["50","100","200","500"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":349,"text":"依危害性化學品標示及通識規則規定，液化氣體標示之危害圖式，其符號應使用下列何種顏色？","options":["黃色","綠色","黑色","藍色。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":350,"text":"依危害性化學品標示及通識規則規定，安全資料表應具有幾項內容？","options":["6","8","12","16"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":351,"text":"依危害性化學品標示及通識規則規定，安全資料表應適時更新，並至少應每幾年檢討1次？","options":["1","2","3","4。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":352,"text":"依缺氧症預防規則規定，下列敘述何者有誤？","options":["氧氣濃度高於18%為缺氧作業場所","儲存穀物之倉庫內部，屬缺氧危險場所","實施換氣時不得使用純氧","雇主使勞工從事缺氧危險作業時，應定期或每次作業開始前確認呼吸防護具之數量及效能，認有異常時，應立即採取必要之措施。"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":353,"text":"依缺氧症預防規則規定，下列敘述何者有誤？","options":["雇主使勞工從事缺氧危險作業，如受鄰接作業場所之影響致有發生缺氧危險之虞時，應與各該作業場所密切保持聯繫","作業場所入口應公告監視人員姓名","密閉相當期間之船艙內部，若內壁實施防銹措施，則非屬缺氧危險場所","勞工戴用輸氣管面罩之作業時間，每次不得超過1小時。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":354,"text":"依缺氧症預防規則規定，缺氧危險作業場所係指空氣中氧氣濃度未達多少%之場所？","options":["14","16","18","20。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":355,"text":"依缺氧症預防規則規定，戴用輸氣管面罩從事缺氧危險作業之勞工，每次連續作業時間不得超過多久？","options":["10分鐘","30分鐘","1小時","2小時。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":356,"text":"依缺氧症預防規則規定，於缺氧危險作業場所入口之公告，不包括下列何者？","options":["罹患缺氧症之虞之事項","進入該場所應採取之措施","缺氧作業主管電話","事故發生時之緊急措施。"],"answer":3 造、處置、使用之特定化學物質為下列何者？","options":["甲類物質","乙類物質","丙類物質","丁類物質。"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":367,"text":"依鉛中毒預防規則規定，得免設置局部排氣裝置或整體換器裝置，不包括下列何種作業？","options":["作業時間短暫","臨時性作業","與其他作業有效隔離勞工不必經常出入","採用濕式作業"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":368,"text":"雇主依特定化學物質危害預防標準規定設置之局部排氣裝置，下列規定何者錯誤？","options":["氣罩應置於每一氣體、蒸汽或粉塵發生源","設置有除塵或廢氣處理裝置者，其排氣機應置於各該裝置之後","應盡量延長導管長度，減少彎曲數目","排氣孔應置於室外。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":369,"text":"某一鉛作業場所鉛作業人數為60人，均為軟焊作業，則本鉛作業場所整體換氣裝置之換氣量約為每分鐘多少立方公尺以上？","options":["60","100","600","1000"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":370,"text":"依粉塵危害預防標準規定，下述何者有誤？","options":["作業場所禁止飲食","至少每4小時清掃1次以上","應指定粉塵作業主管","若作業場所對於粉塵飛揚之清掃方法有困難，可以採行供給勞工使用呼吸防護具，以代替每日至少清掃1次以上之規定。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":371,"text":"依有機溶劑中毒預防規則之立法精神，下列何種有機溶劑對勞工之健康危害最大？","options":["第一種","第二種","第三種","第四種"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":372,"text":"依四烷基鉛中毒預防規則規定，雇主於處理四烷基鉛或加鉛汽油作業之場所，應置備藥品材料，下列何者有誤？","options":["洗眼液、吸附劑等急救藥品","肥皂或其他適當清洗劑","氧化劑及其他防止擴散之材料","解毒劑"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":373,"text":"空氣呼吸器使用前應注意事項，下列敘述何者錯誤？","options":["確認瓶內空氣量","確認輸氣管有無破損","檢查面體與顏面之密合度是否良好","呼氣阻抗愈大愈佳。"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":374,"text":"懸浮於空氣中的微小液滴為下列何者？","options":["燻煙","霧滴","煙霧","粉塵。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":375,"text":"危害性化學品有逸散到作業場所空氣中之虞時，應優先考慮下列何種方法？","options":["密閉設備","局部排氣裝置","整體換氣裝置","自然換氣"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":376,"text":"防範有害物危害之對策，應優先考慮下列何者？","options":["健康管理","行政管理","工程改善","教育訓練。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":377,"text":"為降低個人暴露，可藉控制有害物發生源達成，下列何者屬於此類控制方法？","options":["替代","整體換氣","使用防護具","減少工時"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":378,"text":"依職業安全衛生設施規則規定，勞工在坑內、儲槽、隧道等自然換氣不充分之場所工作，不得使用下列何種機械，以避免排出廢氣危害勞工？","options":["電氣機械","人力機械","具有內燃機之機械","手提電動機械"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":379,"text":"空氣中石綿的濃度單位是下列何者？","options":["ppm","f/c.c.","mg/m","%。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":380,"text":"下列何者非通風換氣之目的？","options":["防止游離輻射","防止火災爆炸","稀釋空氣中有害物","補充新鮮空氣。"],"answer":1,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":381,"text":"能使有害物在其發生源處未擴散前，即加以排除的工程控制方法為下列何者？","options":["整體換氣","熱對流換氣","自然通風","局部排氣"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":382,"text":"局部排氣裝置連接氣罩與排氣機之導管為下列何者？","options":["排氣導管","主導管","肘管","吸氣導管"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":383,"text":"下列何種型式的氣罩最不易受氣罩外氣流的影響？","options":["接收式","外裝式下方吸引式","外裝式側邊吸引式","包圍式"],"answer":4,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":384,"text":"局部排氣裝置之導管裝設，下列何者有誤？","options":["應儘量縮短導管長度","減少彎曲數目","支管需90度與主管相接","應於適當位置設置清潔口與測定孔。"],"answer":3,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":true,"isMultiple":false,"isNegative":true},{"id":385,"text":"局部排氣裝置之動力源指下列何者？","options":["氣罩","排氣機","導管","排氣口。"],"answer":2,"chapter":"第十四章 化學性危害預防管理實務","isNumeric":false,"isMultiple":false,"isNegative":false},{"id":386,"text":"雇主使勞工從事製造、處置或使用危害性化學品時，除應實施3小時的一般安全衛生教育訓練外，應增加多少時數之危害通識訓練課程？","opti "損失牙齒","一隻眼睛失能","一隻手臂失能","一隻小腿截斷"],"answer":1,"chapter":"第十七章 職業災害調查處理與統計","isNumeric":false,"isMultiple":false,"isNegative":true},{"id":469,"text":"某工廠有工人200名，總經歷工時為1000000，共發生10日失能傷害損失日數，則失能傷害嚴重率(SR)為下列何者？","options":["30","10","40","2"],"answer":2,"chapter":"第十七章 職業災害調查處理與統計","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":470,"text":"依勞動檢查法施行細則規定，下列何者系指每百萬工時之失能傷害總損失日數？","options":["事故率","失能傷害千人率","傷害頻率","職業災害嚴重率"],"answer":4,"chapter":"第十七章 職業災害調查處理與統計","isNumeric":true,"isMultiple":false,"isNegative":false},{"id":471,"text":"勞工進入10尺深人孔後因缺氧而死亡，在職業災害調查分析時，未先測定氧氣濃度屬下列何者原因？","options":["直接原因","根本原因","基本原因","間接原因"],"answer":4,"chapter":"第十七章 職業災害調查處理與統計","isNumeric":false,"isMultiple":false,"isNegative":false}];
const TOTAL = 471;

// ── Persistence keys (113 site, separate from root site) ──────────────────────
const WRONG_KEY    = 'osh113_wrong_v1';
const ANSWERED_KEY = 'osh113_answered_v1';
const THEME_KEY    = 'osh113_theme';

// ── Helpers for multi-answer questions ───────────────────────────────────────
function isMultiple(q) {
  return Array.isArray(q.answer);
}
function arraysEqual(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  return [...a].sort((x,y)=>x-y).every((v,i) => v === [...b].sort((x,y)=>x-y)[i]);
}

// ── Load persisted state ──────────────────────────────────────────────────────
let wrongSet = new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]'));

// answered: Map<id, {chosen}>
// chosen is a number (single) or sorted number[] (multi-select)
const _savedAnswered = JSON.parse(localStorage.getItem(ANSWERED_KEY) || '{}');
const answered = new Map(
  Object.entries(_savedAnswered).map(([k, chosen]) => {
    return [+k, { chosen: Array.isArray(chosen) ? chosen : +chosen }];
  })
);

// ── Persist helpers ───────────────────────────────────────────────────────────
function saveWrong() {
  localStorage.setItem(WRONG_KEY, JSON.stringify([...wrongSet]));
  updateWrongLabel();
}
function saveAnswered() {
  const obj = {};
  answered.forEach((val, id) => { obj[id] = val.chosen; });
  localStorage.setItem(ANSWERED_KEY, JSON.stringify(obj));
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function updateProgress() {
  const count = answered.size;
  const pct = TOTAL > 0 ? Math.round(count / TOTAL * 100) : 0;
  const done = pct === 100;

  document.getElementById('progress-label').textContent =
    `已作答 ${count} / ${TOTAL} 題`;
  const accEl = document.getElementById('accuracy-label');
  if (accEl) {
    if (count > 0) {
      const correctCount = count - wrongSet.size;
      const accPct = (correctCount / count * 100).toFixed(2);
      accEl.textContent = `✓ 正確率 ${accPct}%`;
    } else {
      accEl.textContent = '';
    }
  }
  const pctEl = document.getElementById('progress-pct');
  pctEl.textContent = done ? '🎉 全部完成！' : pct + '%';
  pctEl.className = 'progress-pct' + (done ? ' done' : '');

  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'progress-fill' + (done ? ' done' : '');

  document.getElementById('progress-track').setAttribute('aria-valuenow', count);
  updateIncompleteLabel();
}

// ── Wrong-answer helpers ──────────────────────────────────────────────────────
function markWrong(id) {
  wrongSet.add(id);
  saveWrong();
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('was-wrong'); card.classList.remove('answered-ok'); }
}
function unmarkWrong(id) {
  wrongSet.delete(id);
  saveWrong();
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.remove('was-wrong'); card.classList.add('answered-ok'); }
}

// ── Current filter state ──────────────────────────────────────────────────────
let currentFilter = '全部';
let currentSearch = '';

// ── Chapter tag display ───────────────────────────────────────────────────────
function chTag(q) {
  // Show short chapter label
  const ch = q.chapter || '';
  // Extract e.g. "第一章" from full name
  const short = ch.length > 10 ? ch.slice(0, 10) + '…' : ch;
  let cls = 'ch-tag';
  if (q.isMultiple) cls += ' multiple';
  else if (q.isNumeric) cls += ' numeric';
  const badge = q.isMultiple ? ' ☑' : (q.isNumeric ? ' 🔢' : '');
  return `<span class="${cls}">${short}${badge}</span>`;
}

// ── Render multiple-select card ───────────────────────────────────────────────
function renderMultiCard(q) {
  const ans = answered.get(q.id);
  const wasWrong = wrongSet.has(q.id);

  let cardCls = 'card';
  if (ans) {
    cardCls += arraysEqual(ans.chosen, q.answer) ? ' answered-ok' : ' was-wrong';
  } else if (wasWrong) {
    cardCls += ' was-wrong';
  }

  const chosen = ans ? ans.chosen : [];
  const optBtns = q.options.map((opt, i) => {
    const num = i + 1;
    let cls = 'multi-btn';
    let disabled = '';
    if (ans) {
      disabled = 'disabled';
      const inAns    = Array.isArray(ans.chosen) && ans.chosen.includes(num);
      const inAnswer = q.answer.includes(num);
      if (inAnswer && inAns)   cls += ' correct';
      else if (!inAnswer && inAns) cls += ' wrong';
      else if (inAnswer && !inAns) cls += ' missed';
    } else if (Array.isArray(chosen) && chosen.includes(num)) {
      cls += ' selected';
    }
    return `<button class="${cls}" ${disabled} data-id="${q.id}" data-num="${num}">(${num}) ${opt}</button>`;
  }).join('\n');

  const submitDisabled = ans ? 'disabled' : '';
  const submitBtn = `<button class="multi-submit" ${submitDisabled} data-id="${q.id}">確認答案</button>`;

  let resultHtml = '';
  if (ans) {
    const ok = arraysEqual(ans.chosen, q.answer);
    const letters = ['A','B','C','D'];
    const correctLabels = q.answer.map(n => `(${letters[n-1]})`).join(' ');
    if (ok) {
      resultHtml = `<div class="result-row ok show">✅ 答對了！<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    } else {
      resultHtml = `<div class="result-row bad show">❌ 答錯！正確選項：${correctLabels}<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    }
  }

  return `<div class="${cardCls}" id="card-${q.id}">
  <div class="card-header">
    <span class="q-num">Q${q.id}</span>
    ${chTag(q)}
  </div>
  <div class="q-text">${q.text}</div>
  <div class="multi-options">
${optBtns}
${submitBtn}
  </div>
  ${resultHtml}
</div>`;
}

// ── Render single-choice card ──────────────────────────────────────────────────
function renderCard(q) {
  if (isMultiple(q)) return renderMultiCard(q);

  const ans = answered.get(q.id);
  const wasWrong = wrongSet.has(q.id);
  const isNeg = !!q.isNegative;

  let cardCls = 'card';
  if (ans) {
    cardCls += ans.chosen === q.answer ? ' answered-ok' : ' was-wrong';
  } else if (wasWrong) {
    cardCls += ' was-wrong';
  }

  const optBtns = q.options.map((opt, i) => {
    const num = i + 1;
    let cls = 'opt-btn';
    let disabled = '';
    if (ans) {
      disabled = 'disabled';
      if (num === q.answer) cls += isNeg ? ' correct-neg' : ' correct';
      else if (num === ans.chosen) cls += ' wrong';
    }
    return `<button class="${cls}" ${disabled} data-id="${q.id}" data-num="${num}">(${num}) ${opt}</button>`;
  }).join('\n');

  let resultHtml = '';
  if (ans) {
    if (ans.chosen === q.answer) {
      const okCls = isNeg ? 'result-row ok neg show' : 'result-row ok show';
      const okMsg = isNeg ? '⚠️ 答對！（此選項為題目中唯一錯誤的）' : '✅ 答對了！';
      resultHtml = `<div class="${okCls}">${okMsg}<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    } else {
      const negHint = isNeg ? '（反向題，選最不正確的）' : '';
      resultHtml = `<div class="result-row bad show">❌ 答錯！${negHint}正解是 (${q.answer}) ${q.options[q.answer - 1]}<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    }
  }

  const numBadge = q.isNumeric ? ' 🔢' : '';

  return `<div class="${cardCls}" id="card-${q.id}">
  <div class="card-header">
    <span class="q-num">Q${q.id}${numBadge}</span>
    ${chTag(q)}
  </div>
  <div class="q-text">${q.text}</div>
  <div class="options">${optBtns}</div>
  ${resultHtml}
</div>`;
}

// ── Update "未完成" option label ──────────────────────────────────────────────
function updateWrongLabel() {
  const el = document.getElementById('opt-wrong');
  if (el) el.textContent = `⭐ 我的錯題本（${wrongSet.size} 題）`;
}

function updateIncompleteLabel() {
  const cnt = QUESTIONS.filter(q => !answered.has(q.id)).length;
  const el = document.getElementById('opt-incomplete');
  if (el) el.textContent = `📝 未完成（${cnt} 題）`;
}

// ── Filter logic ──────────────────────────────────────────────────────────────
function filteredQuestions() {
  let list = QUESTIONS;
  if (currentFilter === '錯題本') {
    list = list.filter(q => wrongSet.has(q.id));
  } else if (currentFilter === '金庫密碼') {
    list = list.filter(q => q.isNumeric);
  } else if (currentFilter === '複選題') {
    list = list.filter(q => q.isMultiple);
  } else if (currentFilter === '未完成') {
    list = list.filter(q => !answered.has(q.id));
  } else if (currentFilter !== '全部') {
    list = list.filter(q => q.chapter === currentFilter);
  }
  if (currentSearch) {
    const kw = currentSearch.trim().toLowerCase();
    list = list.filter(q =>
      q.text.toLowerCase().includes(kw) ||
      q.options.some(o => o.toLowerCase().includes(kw))
    );
  }
  return list;
}

function filteredBase() {
  if (currentFilter === '錯題本') return wrongSet.size;
  if (currentFilter === '金庫密碼') return QUESTIONS.filter(q => q.isNumeric).length;
  if (currentFilter === '複選題') return QUESTIONS.filter(q => q.isMultiple).length;
  if (currentFilter === '未完成') return QUESTIONS.filter(q => !answered.has(q.id)).length;
  if (currentFilter === '全部') return TOTAL;
  return QUESTIONS.filter(q => q.chapter === currentFilter).length;
}

// ── Render grid ───────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('main-grid');
  const empty = document.getElementById('empty');
  const stats = document.getElementById('stats');
  const clearBtn = document.getElementById('clear-wrong-btn');
  const list = filteredQuestions();

  grid.querySelectorAll('.card').forEach(c => c.remove());

  if (list.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const frag = document.createDocumentFragment();
    list.forEach(q => {
      const tmp = document.createElement('div');
      tmp.innerHTML = renderCard(q);
      frag.appendChild(tmp.firstElementChild);
    });
    grid.appendChild(frag);
  }

  stats.textContent = currentSearch
    ? `顯示 ${list.length} / ${filteredBase()} 題`
    : `共 ${list.length} 題`;

  clearBtn.style.display = currentFilter === '錯題本' && wrongSet.size > 0 ? 'block' : 'none';
}

// ── Event delegation ──────────────────────────────────────────────────────────
document.getElementById('main-grid').addEventListener('click', e => {

  // ── Single-choice option ──
  const optBtn = e.target.closest('.opt-btn');
  if (optBtn && !optBtn.disabled) {
    const id = +optBtn.dataset.id;
    const chosen = +optBtn.dataset.num;
    const q = QUESTIONS.find(q => q.id === id);

    answered.set(id, { chosen });
    saveAnswered();
    updateProgress();

    if (chosen === q.answer) unmarkWrong(id);
    else markWrong(id);

    const card = document.getElementById('card-' + id);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(q);
    card.replaceWith(tmp.firstElementChild);
    return;
  }

  // ── Multiple-select: toggle button ──
  const multiBtn = e.target.closest('.multi-btn');
  if (multiBtn && !multiBtn.disabled) {
    multiBtn.classList.toggle('selected');
    return;
  }

  // ── Multiple-select: confirm submit ──
  const submitBtn = e.target.closest('.multi-submit');
  if (submitBtn && !submitBtn.disabled) {
    const id = +submitBtn.dataset.id;
    const card = document.getElementById('card-' + id);
    const q = QUESTIONS.find(q => q.id === id);

    const chosen = [];
    card.querySelectorAll('.multi-btn.selected').forEach(btn => {
      chosen.push(+btn.dataset.num);
    });
    chosen.sort((a, b) => a - b);

    answered.set(id, { chosen });
    saveAnswered();
    updateProgress();

    if (arraysEqual(chosen, q.answer)) unmarkWrong(id);
    else markWrong(id);

    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(q);
    card.replaceWith(tmp.firstElementChild);
    return;
  }

  // ── Retry ──
  const retryBtn = e.target.closest('.retry-btn');
  if (retryBtn) {
    const id = +retryBtn.dataset.id;
    answered.delete(id);
    saveAnswered();
    updateProgress();

    const q = QUESTIONS.find(q => q.id === id);
    const card = document.getElementById('card-' + id);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(q);
    card.replaceWith(tmp.firstElementChild);
  }
});

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('ch-select').addEventListener('change', e => {
  currentFilter = e.target.value;
  render();
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value;
    render();
  }, 220);
});

document.getElementById('clear-wrong-btn').addEventListener('click', () => {
  if (!confirm('確定清除所有錯題記錄？')) return;
  wrongSet.clear();
  saveWrong();
  document.querySelectorAll('.card.was-wrong').forEach(c => c.classList.remove('was-wrong'));
  render();
});

document.getElementById('reset-progress-btn').addEventListener('click', () => {
  if (!confirm('確定重置所有作答記錄？\n（進度與錯題本都會清空）')) return;
  answered.clear();
  wrongSet.clear();
  saveAnswered();
  saveWrong();
  updateProgress();
  render();
});

// ── Export / Import ───────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const payload = {
    version: 1,
    site: 'osh113',
    exportedAt: new Date().toISOString(),
    wrong: [...wrongSet],
    answered: Object.fromEntries(
      [...answered.entries()].map(([id, {chosen}]) => [id, chosen])
    ),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `osh113-quiz-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').value = '';
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.version !== 1 || !Array.isArray(data.wrong) || typeof data.answered !== 'object') {
        alert('檔案格式不正確，請選擇由本系統匯出的 JSON 檔。');
        return;
      }
      const wCnt = data.wrong.length;
      const aCnt = Object.keys(data.answered).length;
      if (!confirm(`確定匯入此紀錄？\n・已作答：${aCnt} 題\n・錯題本：${wCnt} 題\n\n匯入後將覆蓋目前的進度！`)) return;

      wrongSet = new Set(data.wrong.map(Number));
      saveWrong();

      answered.clear();
      for (const [k, chosen] of Object.entries(data.answered)) {
        const id = +k;
        const q = QUESTIONS.find(q => q.id === id);
        if (q) answered.set(id, {chosen: Array.isArray(chosen) ? chosen : +chosen});
      }
      saveAnswered();

      updateProgress();
      render();
      alert(`匯入完成！已作答 ${answered.size} 題，錯題本 ${wrongSet.size} 題。`);
    } catch (_) {
      alert('讀取失敗，請確認檔案是否為有效的 JSON。');
    }
  };
  reader.readAsText(file);
});

// ── Dark mode ─────────────────────────────────────────────────────────────────
const themeBtn = document.getElementById('theme-btn');

function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeBtn.textContent = dark ? '☀️' : '🌙';
  localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
}

const savedTheme = localStorage.getItem(THEME_KEY);
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
});

// ── Fullscreen (F key) ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.key === 'f' || e.key === 'F') &&
      document.activeElement !== document.getElementById('search-input')) {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
updateProgress();
updateWrongLabel();
render();
</script>
