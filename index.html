<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>職業安全衛生題庫練習</title>
<meta name="description" content="營造業丙種業務主管與作業主管的互動式題庫練習，共四個題庫。">
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --border: #dde1e7;
  --text: #1a1a2e;
  --text2: #5a6272;
  --track: #e0e5ec;
  --head: #263238;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --blue: #1e6fbf;
  --green: #2e7d32;
  --purple: #6a1b9a;
  --orange: #bf5a0b;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2e3347;
  --text: #e8eaf0;
  --text2: #8a91a8;
  --track: #2e3347;
  --head: #1a1d27;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
  --blue: #4d9de0;
  --green: #66bb6a;
  --purple: #ce93d8;
  --orange: #f0a35e;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", sans-serif;
  line-height: 1.55;
  min-height: 100vh;
}
header {
  background: var(--head);
  color: #fff;
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
}
.head-inner {
  max-width: 928px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; }
.head-sub { font-size: .88rem; color: rgba(255,255,255,.72); margin-top: 2px; }
#theme-btn {
  flex: none;
  width: 44px;
  height: 44px;
  font-size: 1.15rem;
  color: #fff;
  background: rgba(255,255,255,.14);
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
#theme-btn:hover { background: rgba(255,255,255,.24); }
main { max-width: 960px; margin: 0 auto; padding: 22px 16px 12px; }
h2 {
  font-size: .95rem;
  font-weight: 700;
  color: var(--text2);
  margin: 0 0 10px;
}
section + section { margin-top: 26px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card {
  --accent: var(--blue);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 18px;
  color: inherit;
  text-decoration: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 4px solid var(--accent);
  border-radius: 12px;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.14); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent, #4d9de0); outline-offset: 2px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card-title { font-size: 1.14rem; font-weight: 700; }
.card-count { flex: none; font-size: .9rem; font-weight: 700; color: var(--accent); }
.card-desc { font-size: .88rem; color: var(--text2); flex: 1; }
.track { height: 7px; background: var(--track); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; }
.card-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: .84rem;
  color: var(--text2);
}
.go { font-weight: 700; color: var(--accent); white-space: nowrap; }
footer {
  max-width: 960px;
  margin: 0 auto;
  padding: 14px 16px 32px;
  font-size: .8rem;
  color: var(--text2);
}
@media (max-width: 640px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover { transform: none; }
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div>
      <h1>職業安全衛生題庫練習</h1>
      <p class="head-sub">4 個題庫，共 3,324 題</p>
    </div>
    <button id="theme-btn" type="button" aria-label="切換深色模式">🌙</button>
  </div>
</header>

<main>
  <section aria-labelledby="group-c">
    <h2 id="group-c">營造業丙種職業安全衛生業務主管</h2>
    <div class="grid" id="grid-c"></div>
  </section>
  <section aria-labelledby="group-s">
    <h2 id="group-s">作業主管</h2>
    <div class="grid" id="grid-s"></div>
  </section>
</main>

<footer>作答進度只存在目前這個瀏覽器；換裝置時可用各題庫的匯出、匯入功能帶過去。內容僅供練習參考。</footer>

<script>
const BANKS = [
  { group: 'grid-c', href: '112/',  title: '112 版', count: 402,  accent: '--blue',   key: 'osh',    desc: '112.05.16 版參考題型，依法規分類。' },
  { group: 'grid-c', href: '113/',  title: '113 版', count: 471,  accent: '--green',  key: 'osh113', desc: '113 年版精選題目。' },
  { group: 'grid-s', href: 'kyso/', title: '缺氧作業主管', count: 1692, accent: '--purple', key: 'kyso', desc: '綜合多種來源，含單選、是非與複選題。' },
  { group: 'grid-s', href: 'roof/', title: '屋頂作業主管', count: 759,  accent: '--orange', key: 'roof', desc: '線上模擬測驗彙整，可能未涵蓋全部題目。' },
];

// Storage can be blocked or hold bad data; the page must still render.
function readJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch (e) { return fallback; }
}

function countOf(value) {
  return Array.isArray(value) ? value.length : Object.keys(value).length;
}

for (const bank of BANKS) {
  const done = Math.min(countOf(readJSON(bank.key + '_answered_v1', {})), bank.count);
  const wrong = countOf(readJSON(bank.key + '_wrong_v1', []));
  const pct = Math.round(done / bank.count * 100);
  const status = done === 0 ? '尚未開始'
    : done === bank.count ? `全部完成，錯題 ${wrong} 題`
    : `已作答 ${done} 題（${pct}%），錯題 ${wrong} 題`;

  const card = document.createElement('a');
  card.className = 'card';
  card.href = bank.href;
  card.style.setProperty('--accent', `var(${bank.accent})`);
  card.innerHTML = `
    <div class="card-top">
      <span class="card-title">${bank.title}</span>
      <span class="card-count">${bank.count.toLocaleString('en-US')} 題</span>
    </div>
    <p class="card-desc">${bank.desc}</p>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="card-foot"><span>${status}</span><span class="go">${done ? '繼續' : '開始'} →</span></div>`;
  document.getElementById(bank.group).appendChild(card);
}

const btn = document.getElementById('theme-btn');
function applyTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  btn.textContent = dark ? '☀️' : '🌙';
  btn.setAttribute('aria-label', dark ? '切換淺色模式' : '切換深色模式');
}
let saved = null;
try { saved = localStorage.getItem('portal_theme'); } catch (e) {}
applyTheme(saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
btn.addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  applyTheme(dark);
  try { localStorage.setItem('portal_theme', dark ? 'dark' : 'light'); } catch (e) {}
});
</script>
</body>
</html>
