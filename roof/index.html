<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>屋頂作業主管安全衛生教育訓練題庫（759 題）</title>
<style>
/* ── Reset & Base ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
    "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background .25s, color .25s;
}

/* ── Color tokens ─────────────────────────────────── */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: #dde1e7;
  --text: #1a1a2e;
  --text2: #5a6272;
  --primary: #bf5a0b;
  --primary-dark: #8f4208;
  --correct: #0f7a42;
  --correct-bg: #d4edda;
  --wrong: #c0392b;
  --wrong-bg: #fde8e6;
  --wrong-border: #e74c3c;
  --tag-bg: #fdebd9;
  --tag-color: #a34c08;
  --progress-track: #e0e5ec;
  --progress-fill: #bf5a0b;
  --progress-done: #0f7a42;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --radius: 12px;
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3347;
  --text: #e8eaf0;
  --text2: #8a91a8;
  --primary: #f0a35e;
  --primary-dark: #8f4208;
  --correct: #2ecc71;
  --correct-bg: #0d3320;
  --wrong: #e74c3c;
  --wrong-bg: #3d1212;
  --wrong-border: #e74c3c;
  --tag-bg: #3a2510;
  --tag-color: #f0a35e;
  --progress-track: #22263a;
  --progress-fill: #f0a35e;
  --progress-done: #2ecc71;
  --shadow: 0 2px 8px rgba(0,0,0,.35);
}

/* ── Site nav ─────────────────────────────────────── */
.site-nav {
  background: var(--primary-dark);
  padding: 4px 16px;
  display: flex; gap: 4px; align-items: center;
  font-size: .76rem;
}
.site-nav a, .site-nav .cur {
  color: rgba(255,255,255,.75);
  text-decoration: none;
  padding: 2px 8px; border-radius: 4px;
  white-space: nowrap;
}
.site-nav a:hover { color: #fff; background: rgba(255,255,255,.15); }
.site-nav .cur { color: #fff; font-weight: 700; background: rgba(255,255,255,.2); }
.site-nav .sep { color: rgba(255,255,255,.3); }

/* ── Sticky top wrapper ───────────────────────────── */
.sticky-top {
  position: sticky; top: 0; z-index: 100;
}

/* ── Header ───────────────────────────────────────── */
header {
  background: var(--primary);
  color: #fff;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.2);
}
header h1 {
  font-size: 1rem; font-weight: 700; flex: 1;
  line-height: 1.3;
}
header h1 small {
  font-size: .72rem; font-weight: 400; opacity: .8;
  white-space: nowrap;
}
#theme-btn {
  background: rgba(255,255,255,.2); border: none;
  border-radius: 8px; padding: 6px 10px;
  cursor: pointer; color: #fff; font-size: 1.1rem;
  transition: background .2s;
}
#theme-btn:hover { background: rgba(255,255,255,.35); }
#eta {
  font-size: 1.1rem; font-weight: 500; color: rgba(255,255,255,.82);
  background: rgba(255,255,255,.11); border-radius: 8px;
  padding: 6px 10px; white-space: nowrap; letter-spacing: .02em;
}
#clock {
  font-size: 1.1rem; font-weight: 600; color: rgba(255,255,255,.9);
  background: rgba(255,255,255,.15); border-radius: 8px;
  padding: 6px 10px; letter-spacing: .04em; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ── Progress bar ─────────────────────────────────── */
.progress-section {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.progress-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 5px;
}
.progress-label {
  font-size: .82rem; font-weight: 600; color: var(--text2);
}
.accuracy-label {
  font-size: .82rem; font-weight: 700; color: var(--correct);
}
.progress-pct {
  font-size: .82rem; font-weight: 700; color: var(--primary);
  transition: color .4s;
}
.progress-pct.done { color: var(--correct); }
.progress-track {
  height: 8px; border-radius: 99px;
  background: var(--progress-track);
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 99px;
  background: var(--progress-fill);
  width: 0%;
  transition: width .4s ease, background .4s;
}
.progress-fill.done { background: var(--progress-done); }

/* ── Controls ─────────────────────────────────────── */
.controls {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.controls select, .controls input {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: .95rem;
  background: var(--surface2);
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.controls select:focus, .controls input:focus { border-color: var(--primary); }
#ch-select { flex: 0 0 auto; max-width: 100%; }
#ch-select option, #ch-select optgroup {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#search-input { flex: 1; min-width: 160px; }
#stats {
  font-size: .82rem; color: var(--text2);
  white-space: nowrap;
}
#clear-wrong-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--wrong-bg); color: var(--wrong);
  border: 1px solid var(--wrong-border); border-radius: 8px;
  cursor: pointer; display: none;
}
#clear-wrong-btn:hover { opacity: .85; }
#reset-progress-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer;
}
#reset-progress-btn:hover { border-color: var(--primary); color: var(--primary); }
#export-btn, #import-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer;
}
#export-btn:hover { border-color: #0f7a42; color: #0f7a42; }
#import-btn:hover { border-color: var(--primary); color: var(--primary); }
#show-answers-btn {
  font-size: .8rem; padding: 6px 10px;
  background: var(--surface2); color: var(--text2);
  border: 1.5px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: all .2s;
}
#show-answers-btn:hover { border-color: var(--correct); color: var(--correct); }
#show-answers-btn.active {
  background: var(--correct-bg); color: var(--correct); border-color: var(--correct);
}
.show-answers .opt-btn[data-answer]:not([disabled]) {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct); font-weight: 600;
}
.show-answers .opt-btn[data-neg-answer]:not([disabled]) {
  background: #fffde7; border-color: #f9a825; color: #5d4037;
  font-weight: 600; text-decoration: line-through;
  text-decoration-color: #e65100; text-decoration-thickness: 2px;
}
[data-theme="dark"] .show-answers .opt-btn[data-neg-answer]:not([disabled]) {
  background: #3e2f00; border-color: #f9a825; color: #ffe082;
  text-decoration-color: #ffb300;
}
.show-answers .multi-btn[data-answer]:not([disabled]),
.show-answers .tf-btn[data-answer]:not([disabled]) {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct); font-weight: 600;
}

/* ── Main grid ────────────────────────────────────── */
main {
  max-width: 1300px; margin: 0 auto;
  padding: 16px 16px 60px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
@media (min-width: 1024px) {
  main { grid-template-columns: 1fr 1fr; }
}

/* ── Question card ────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
  border-left: 4px solid var(--border);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .2s, box-shadow .2s;
  position: relative;
}
.card.was-wrong { border-left-color: var(--wrong-border); }
.card.answered-ok { border-left-color: var(--correct); }
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }

.card-header {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.q-num {
  font-weight: 700; color: var(--primary); font-size: .9rem;
  white-space: nowrap; margin-top: 2px;
}
.ch-tag {
  font-size: .72rem; font-weight: 600;
  background: var(--tag-bg); color: var(--tag-color);
  padding: 2px 7px; border-radius: 20px;
  white-space: nowrap; line-height: 1.6;
  max-width: 160px; overflow: hidden; text-overflow: ellipsis;
}
.ch-tag.numeric { background: #fff3e0; color: #e65100; }
.ch-tag.tf { background: #e8f5e9; color: #2e7d32; }

.q-text {
  font-size: 1rem; font-weight: 500; color: var(--text);
  line-height: 1.55;
}

/* ── Options: single-choice (4 buttons) ─────────────  */
.options { display: flex; flex-direction: column; gap: 7px; }
.opt-btn {
  width: 100%; text-align: left;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .93rem; cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
  line-height: 1.5;
  min-height: 44px;
}
.opt-btn:hover:not(:disabled) {
  background: var(--tag-bg); border-color: var(--primary);
  transform: translateX(2px);
}
.opt-btn:disabled { cursor: default; }
.opt-btn.correct {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct);
  font-weight: 600;
}
.opt-btn.wrong {
  background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong);
}
/* 反向題：正確答案 = 唯一錯誤選項，黃底刪除線 */
.opt-btn.correct-neg {
  background: #fffde7; border-color: #f9a825; color: #5d4037;
  font-weight: 600;
  text-decoration: line-through;
  text-decoration-color: #e65100;
  text-decoration-thickness: 2px;
}
[data-theme="dark"] .opt-btn.correct-neg {
  background: #3e2f00; border-color: #f9a825; color: #ffe082;
  text-decoration-color: #ffb300;
}

/* ── T/F options: 2 large buttons side by side ───── */
.tf-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tf-btn {
  padding: 16px 10px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 1.05rem; font-weight: 600;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
  text-align: center;
  min-height: 60px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tf-btn:hover:not(:disabled) {
  background: var(--tag-bg); border-color: var(--primary);
  transform: scale(1.02);
}
.tf-btn:disabled { cursor: default; }
.tf-btn.correct {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct);
  font-weight: 700;
}
.tf-btn.wrong {
  background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong);
}

/* ── Multiple-select: checkboxes + submit ─────────── */
.multi-options { display: flex; flex-direction: column; gap: 7px; }
.multi-btn {
  width: 100%; text-align: left;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .93rem; cursor: pointer;
  transition: background .15s, border-color .15s;
  line-height: 1.5;
  min-height: 44px;
  display: flex; align-items: center; gap: 8px;
  position: relative;
}
.multi-btn::before {
  content: '';
  width: 18px; height: 18px; flex-shrink: 0;
  border-radius: 4px;
  border: 2px solid var(--border);
  background: var(--surface);
  transition: background .15s, border-color .15s;
}
.multi-btn.selected {
  border-color: var(--primary);
  background: var(--tag-bg);
}
.multi-btn.selected::before {
  background: var(--primary); border-color: var(--primary);
  box-shadow: inset 0 0 0 3px #fff;
}
.multi-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--tag-bg); }
.multi-btn:disabled { cursor: default; }
.multi-btn.correct {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct);
  font-weight: 600;
}
.multi-btn.correct::before { background: var(--correct); border-color: var(--correct); box-shadow: inset 0 0 0 3px #fff; }
.multi-btn.wrong {
  background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong);
}
.multi-btn.wrong::before { background: var(--wrong); border-color: var(--wrong); box-shadow: inset 0 0 0 3px #fff; }
.multi-btn.missed {
  background: var(--correct-bg); border-color: var(--correct); color: var(--correct);
  font-weight: 600; opacity: .7;
}
.multi-submit {
  margin-top: 4px;
  padding: 9px 18px;
  border-radius: 8px;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: .93rem; font-weight: 600;
  cursor: pointer;
  transition: background .15s, opacity .15s;
  align-self: flex-start;
}
.multi-submit:hover { opacity: .87; }
.multi-submit:disabled { opacity: .4; cursor: default; }

/* Result row */
.result-row {
  display: none; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 8px;
  font-size: .9rem; font-weight: 600;
  flex-wrap: wrap;
}
.result-row.show { display: flex; }
.result-row.ok { background: var(--correct-bg); color: var(--correct); }
.result-row.ok.neg { background: #fffde7; color: #e65100; }
[data-theme="dark"] .result-row.ok.neg { background: #3e2f00; color: #ffb300; }
.result-row.bad { background: var(--wrong-bg); color: var(--wrong); }
.retry-btn {
  margin-left: auto; padding: 4px 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; font-size: .82rem; color: var(--text2);
}
.retry-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ── Empty state ──────────────────────────────────── */
#empty {
  display: none;
  grid-column: 1 / -1;
  text-align: center; padding: 60px 20px;
  color: var(--text2); font-size: 1.1rem;
}

/* ── Scrollbar ─────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Mobile tweaks ────────────────────────────────── */
@media (max-width: 600px) {
  header h1 { font-size: .9rem; }
  .q-text { font-size: .97rem; }
  .opt-btn { font-size: .91rem; padding: 11px 12px; min-height: 52px; }
  .tf-btn { font-size: .97rem; min-height: 56px; }
  .controls { flex-wrap: wrap; }
  #ch-select { width: 100%; }
  #search-input { flex: 1 1 140px; }
  .progress-section { padding: 6px 12px 8px; }
}
[data-theme="dark"] header { background: #8f4208; }
[data-theme="dark"] .ch-tag.numeric { background: #3a2510; color: #ffb74d; }
#theme-btn { display: inline-flex; align-items: center; justify-content: center; }
#theme-btn svg { display: block; width: 20px; height: 20px; }
</style>
</head>

<main id="main-grid">

const TOTAL = 759;
const MULTI_COUNT = 105;

// ── Persistence keys (roof site, separate from other sites) ──────────────────
const WRONG_KEY    = 'roof_wrong_v1';
const ANSWERED_KEY = 'roof_answered_v1';
const THEME_KEY    = 'roof_theme';

// ── Load persisted state ──────────────────────────────────────────────────────
let wrongSet = new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]'));

const _savedAnswered = JSON.parse(localStorage.getItem(ANSWERED_KEY) || '{}');
const answered = new Map(
  // chosen can be int (single/TF) or array (multiple) — don't coerce
  Object.entries(_savedAnswered).map(([k, chosen]) => [+k, {chosen}])
);

// ── Persist helpers ───────────────────────────────────────────────────────────
function saveWrong() {
  localStorage.setItem(WRONG_KEY, JSON.stringify([...wrongSet]));
  updateWrongLabel();
}
function saveAnswered() {
  const obj = {};
  answered.forEach((val, id) => { obj[id] = val.chosen; });
  localStorage.setItem(ANSWERED_KEY, JSON.stringify(obj));
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function updateProgress() {
  const count = answered.size;
  const pct = TOTAL > 0 ? Math.round(count / TOTAL * 100) : 0;
  const done = pct === 100;

  document.getElementById('progress-label').textContent =
    `已作答 ${count} / ${TOTAL} 題`;
  const accEl = document.getElementById('accuracy-label');
  if (accEl) {
    if (count > 0) {
      const correctCount = count - wrongSet.size;
      const accPct = (correctCount / count * 100).toFixed(2);
      accEl.textContent = `✓ 正確率 ${accPct}%`;
    } else {
      accEl.textContent = '';
    }
  }
  const pctEl = document.getElementById('progress-pct');
  pctEl.textContent = done ? '🎉 全部完成！' : pct + '%';
  pctEl.className = 'progress-pct' + (done ? ' done' : '');

  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'progress-fill' + (done ? ' done' : '');

  document.getElementById('progress-track').setAttribute('aria-valuenow', count);
  updateIncompleteLabel();
}

// ── Wrong-answer helpers ──────────────────────────────────────────────────────
function markWrong(id) {
  wrongSet.add(id);
  saveWrong();
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('was-wrong'); card.classList.remove('answered-ok'); }
}
function unmarkWrong(id) {
  wrongSet.delete(id);
  saveWrong();
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.remove('was-wrong'); card.classList.add('answered-ok'); }
}

// ── Current filter state ──────────────────────────────────────────────────────
let currentFilter = '全部';
let currentSearch = '';

// ── Source tag display ────────────────────────────────────────────────────────
function srcTag(q) {
  const src = q.chapter || '';
  let cls = 'ch-tag';
  let badge = '';
  if (q.type === 'truefalse') { cls += ' tf'; badge = ' ✅'; }
  else if (q.isNumeric) { cls += ' numeric'; badge = ' 🔢'; }
  const short = src.length > 10 ? src.slice(0, 10) + '…' : src;
  return `<span class="${cls}">${short}${badge}</span>`;
}

// ── Multiple-select helpers ───────────────────────────────────────────────────
function arraysEqual(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  return [...a].sort((x,y)=>x-y).every((v,i) => v === [...b].sort((x,y)=>x-y)[i]);
}

// ── Render multiple-select card ───────────────────────────────────────────────
function renderMultiCard(q) {
  const ans = answered.get(q.id);
  const wasWrong = wrongSet.has(q.id);

  let cardCls = 'card';
  if (ans) {
    cardCls += arraysEqual(ans.chosen, q.answer) ? ' answered-ok' : ' was-wrong';
  } else if (wasWrong) {
    cardCls += ' was-wrong';
  }

  const chosen = ans ? (Array.isArray(ans.chosen) ? ans.chosen : [ans.chosen]) : [];

  const optBtns = q.options.map((opt, i) => {
    const num = i + 1;
    let cls = 'multi-btn';
    let disabled = '';
    if (ans) {
      disabled = 'disabled';
      const inAns    = q.answer.includes(num);
      const inChosen = chosen.includes(num);
      if (inAns && inChosen)  cls += ' correct';
      else if (!inAns && inChosen) cls += ' wrong';
      else if (inAns && !inChosen) cls += ' missed';
    } else if (chosen.includes(num)) {
      cls += ' selected';
    }
    const ansAttr = q.answer.includes(num) ? ' data-answer' : '';
    return `<button class="${cls}" ${disabled} data-id="${q.id}" data-num="${num}"${ansAttr}>${opt}</button>`;
  }).join('\n');

  const submitDisabled = ans ? 'disabled' : '';
  const submitBtn = `<button class="multi-submit" ${submitDisabled} data-id="${q.id}">確認答案</button>`;

  let resultHtml = '';
  if (ans) {
    const ok = arraysEqual(ans.chosen, q.answer);
    if (ok) {
      resultHtml = `<div class="result-row ok show">✅ 答對了！<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    } else {
      const correctLabel = q.answer.map(n => `(${n})`).join('');
      resultHtml = `<div class="result-row bad show">❌ 答錯！正解是 ${correctLabel}<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    }
  }

  return `<div class="${cardCls}" id="card-${q.id}">
  <div class="card-header">
    <span class="q-num">Q${q.id} <span style="font-size:.75rem;font-weight:400;color:var(--primary)">複選</span></span>
    ${srcTag(q)}
  </div>
  <div class="q-text">${q.text}</div>
  <div class="multi-options">${optBtns}${submitBtn}</div>
  ${resultHtml}
</div>`;
}

// ── Render T/F card ───────────────────────────────────────────────────────────
function renderTFCard(q) {
  const ans = answered.get(q.id);
  const wasWrong = wrongSet.has(q.id);
  const isNeg = !!q.isNegative;

  let cardCls = 'card';
  if (ans) {
    cardCls += ans.chosen === q.answer ? ' answered-ok' : ' was-wrong';
  } else if (wasWrong) {
    cardCls += ' was-wrong';
  }

  const opts = [
    {num: 1, label: '○正確', emoji: '○'},
    {num: 2, label: '✕錯誤', emoji: '✕'},
  ];

  const tfBtns = opts.map(o => {
    let cls = 'tf-btn';
    let disabled = '';
    if (ans) {
      disabled = 'disabled';
      if (o.num === q.answer) cls += ' correct';
      else if (o.num === ans.chosen) cls += ' wrong';
    }
    const ansAttr = o.num === q.answer ? ' data-answer' : '';
    return `<button class="${cls}" ${disabled} data-id="${q.id}" data-num="${o.num}"${ansAttr}>${o.label}</button>`;
  }).join('\n');

  let resultHtml = '';
  if (ans) {
    if (ans.chosen === q.answer) {
      resultHtml = `<div class="result-row ok show">✅ 答對了！<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    } else {
      const correctLabel = q.answer === 1 ? '○ 正確' : '✕ 錯誤';
      resultHtml = `<div class="result-row bad show">❌ 答錯！正解是「${correctLabel}」<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    }
  }

  return `<div class="${cardCls}" id="card-${q.id}">
  <div class="card-header">
    <span class="q-num">Q${q.id}</span>
    ${srcTag(q)}
  </div>
  <div class="q-text">${q.text}</div>
  <div class="tf-options">${tfBtns}</div>
  ${resultHtml}
</div>`;
}

// ── Render single-choice card ─────────────────────────────────────────────────
function renderCard(q) {
  if (q.type === 'truefalse') return renderTFCard(q);
  if (q.type === 'multiple')  return renderMultiCard(q);

  const ans = answered.get(q.id);
  const wasWrong = wrongSet.has(q.id);
  const isNeg = !!q.isNegative;

  let cardCls = 'card';
  if (ans) {
    cardCls += ans.chosen === q.answer ? ' answered-ok' : ' was-wrong';
  } else if (wasWrong) {
    cardCls += ' was-wrong';
  }

  const optBtns = q.options.map((opt, i) => {
    const num = i + 1;
    let cls = 'opt-btn';
    let disabled = '';
    if (ans) {
      disabled = 'disabled';
      if (num === q.answer) cls += isNeg ? ' correct-neg' : ' correct';
      else if (num === ans.chosen) cls += ' wrong';
    }
    const ansAttr = num === q.answer ? (isNeg ? ' data-neg-answer' : ' data-answer') : '';
    return `<button class="${cls}" ${disabled} data-id="${q.id}" data-num="${num}"${ansAttr}>(${num}) ${opt}</button>`;
  }).join('\n');

  let resultHtml = '';
  if (ans) {
    if (ans.chosen === q.answer) {
      const okCls = isNeg ? 'result-row ok neg show' : 'result-row ok show';
      const okMsg = isNeg
        ? '⚠️ 答對！（此選項為題目中唯一錯誤的）'
        : '✅ 答對了！';
      resultHtml = `<div class="${okCls}">${okMsg}<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    } else {
      const negHint = isNeg ? '（反向題，選最不正確的）' : '';
      resultHtml = `<div class="result-row bad show">❌ 答錯！${negHint}正解是 (${q.answer}) ${q.options[q.answer - 1]}<button class="retry-btn" data-id="${q.id}">重試</button></div>`;
    }
  }

  const numBadge = q.isNumeric ? ' 🔢' : '';
  return `<div class="${cardCls}" id="card-${q.id}">
  <div class="card-header">
    <span class="q-num">Q${q.id}${numBadge}</span>
    ${srcTag(q)}
  </div>
  <div class="q-text">${q.text}</div>
  <div class="options">${optBtns}</div>
  ${resultHtml}
</div>`;
}

// ── Update "未完成" option label ──────────────────────────────────────────────
function updateWrongLabel() {
  const el = document.getElementById('opt-wrong');
  if (el) el.textContent = `⭐ 我的錯題本（${wrongSet.size} 題）`;
}

function updateIncompleteLabel() {
  const cnt = QUESTIONS.filter(q => !answered.has(q.id)).length;
  const el = document.getElementById('opt-incomplete');
  if (el) el.textContent = `📝 未完成（${cnt} 題）`;
}

// ── Filter logic ──────────────────────────────────────────────────────────────
function filteredQuestions() {
  let list = QUESTIONS;
  if (currentFilter === '錯題本') {
    list = list.filter(q => wrongSet.has(q.id));
  } else if (currentFilter === '金庫密碼') {
    list = list.filter(q => q.isNumeric);
  } else if (currentFilter === '是非題') {
    list = list.filter(q => q.type === 'truefalse');
  } else if (currentFilter === '複選題') {
    list = list.filter(q => q.type === 'multiple');
  } else if (currentFilter === '未完成') {
    list = list.filter(q => !answered.has(q.id));
  } else if (currentFilter !== '全部') {
    list = list.filter(q => q.chapter === currentFilter || q.source === currentFilter);
  }
  if (currentSearch) {
    const kw = currentSearch.trim().toLowerCase();
    list = list.filter(q =>
      q.text.toLowerCase().includes(kw) ||
      q.options.some(o => o.toLowerCase().includes(kw))
    );
  }
  return list;
}

function filteredBase() {
  if (currentFilter === '錯題本') return wrongSet.size;
  if (currentFilter === '金庫密碼') return QUESTIONS.filter(q => q.isNumeric).length;
  if (currentFilter === '是非題') return QUESTIONS.filter(q => q.type === 'truefalse').length;
  if (currentFilter === '複選題') return QUESTIONS.filter(q => q.type === 'multiple').length;
  if (currentFilter === '未完成') return QUESTIONS.filter(q => !answered.has(q.id)).length;
  if (currentFilter === '全部') return TOTAL;
  return QUESTIONS.filter(q => q.chapter === currentFilter || q.source === currentFilter).length;
}

// ── Render grid ───────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('main-grid');
  const empty = document.getElementById('empty');
  const stats = document.getElementById('stats');
  const clearBtn = document.getElementById('clear-wrong-btn');
  const list = filteredQuestions();

  grid.querySelectorAll('.card').forEach(c => c.remove());

  if (list.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const frag = document.createDocumentFragment();
    list.forEach(q => {
      const tmp = document.createElement('div');
      tmp.innerHTML = renderCard(q);
      frag.appendChild(tmp.firstElementChild);
    });
    grid.appendChild(frag);
  }

  stats.textContent = currentSearch
    ? `顯示 ${list.length} / ${filteredBase()} 題`
    : `共 ${list.length} 題`;

  clearBtn.style.display = currentFilter === '錯題本' && wrongSet.size > 0 ? 'block' : 'none';
}

// ── Event delegation ──────────────────────────────────────────────────────────
document.getElementById('main-grid').addEventListener('click', e => {
  // ── Single / T/F answer ──
  const optBtn = e.target.closest('.opt-btn, .tf-btn');
  if (optBtn && !optBtn.disabled) {
    const id = +optBtn.dataset.id;
    const chosen = +optBtn.dataset.num;
    const q = QUESTIONS.find(q => q.id === id);

    answered.set(id, {chosen});
    saveAnswered();
    

    if (chosen === q.answer) unmarkWrong(id);
    else markWrong(id);
    updateProgress();

    const card = document.getElementById('card-' + id);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(q);
    card.replaceWith(tmp.firstElementChild);
    return;
  }

  // ── Multiple-select: toggle button ──
  const multiBtn = e.target.closest('.multi-btn');
  if (multiBtn && !multiBtn.disabled) {
    multiBtn.classList.toggle('selected');
    return;
  }

  // ── Multiple-select: submit ──
  const submitBtn = e.target.closest('.multi-submit');
  if (submitBtn && !submitBtn.disabled) {
    const id = +submitBtn.dataset.id;
    const card = document.getElementById('card-' + id);
    const q = QUESTIONS.find(q => q.id === id);

    // Collect selected options
    const chosen = [];
    card.querySelectorAll('.multi-btn.selected').forEach(btn => {
      chosen.push(+btn.dataset.num);
    });
    chosen.sort((a, b) => a - b);

    answered.set(id, {chosen});
    saveAnswered();
    

    if (arraysEqual(chosen, q.answer)) unmarkWrong(id);
    else markWrong(id);
    updateProgress();

    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(q);
    card.replaceWith(tmp.firstElementChild);
    return;
  }

  // ── Retry ──
  const retryBtn = e.target.closest('.retry-btn');
  if (retryBtn) {
    const id = +retryBtn.dataset.id;
    answered.delete(id);
    saveAnswered();
    updateProgress();

    const q = QUESTIONS.find(q => q.id === id);
    const card = document.getElementById('card-' + id);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(q);
    card.replaceWith(tmp.firstElementChild);
  }
});

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('ch-select').addEventListener('change', e => {
  currentFilter = e.target.value;
  render();
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value;
    render();
  }, 220);
});

document.getElementById('clear-wrong-btn').addEventListener('click', () => {
  if (!confirm('確定清除所有錯題記錄？')) return;
  wrongSet.clear();
  saveWrong();
  document.querySelectorAll('.card.was-wrong').forEach(c => c.classList.remove('was-wrong'));
  render();
});

document.getElementById('reset-progress-btn').addEventListener('click', () => {
  if (!confirm('確定重置所有作答記錄？\n（進度與錯題本都會清空）')) return;
  answered.clear();
  wrongSet.clear();
  saveAnswered();
  saveWrong();
  updateProgress();
  render();
});

// ── Export / Import ───────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const payload = {
    version: 1,
    site: 'roof',
    exportedAt: new Date().toISOString(),
    wrong: [...wrongSet],
    answered: Object.fromEntries(
      [...answered.entries()].map(([id, {chosen}]) => [id, chosen])
    ),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `roof-quiz-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').value = '';
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.version !== 1 || !Array.isArray(data.wrong) || typeof data.answered !== 'object') {
        alert('檔案格式不正確，請選擇由本系統匯出的 JSON 檔。');
        return;
      }
      const wCnt = data.wrong.length;
      const aCnt = Object.keys(data.answered).length;
      if (!confirm(`確定匯入此紀錄？\n・已作答：${aCnt} 題\n・錯題本：${wCnt} 題\n\n匯入後將覆蓋目前的進度！`)) return;

      wrongSet = new Set(data.wrong.map(Number));
      saveWrong();

      answered.clear();
      for (const [k, chosen] of Object.entries(data.answered)) {
        answered.set(+k, {chosen: +chosen});
      }
      saveAnswered();

      updateProgress();
      render();
      alert(`匯入完成！已作答 ${answered.size} 題，錯題本 ${wrongSet.size} 題。`);
    } catch (_) {
      alert('讀取失敗，請確認檔案是否為有效的 JSON。');
    }
  };
  reader.readAsText(file);
});

// ── Show-answers toggle ───────────────────────────────────────────────────────
(function() {
  const btn = document.getElementById('show-answers-btn');
  btn.addEventListener('click', () => {
    const on = document.body.classList.toggle('show-answers');
    btn.classList.toggle('active', on);
    btn.textContent = on ? '🙈 隱藏答案' : '👁 顯示答案';
  });
})();

// ── Clock + ETA ───────────────────────────────────────────────────────────────
(function() {
  const clockEl = document.getElementById('clock');
  const etaEl   = document.getElementById('eta');
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    clockEl.textContent = `${h}:${m}:${s}`;

    const remaining = TOTAL - answered.size;
    if (remaining <= 0) {
      etaEl.textContent = '';
    } else {
      const totalMin = Math.ceil(remaining / 40 * 60);
      const rh  = Math.floor(totalMin / 60);
      const rm  = totalMin % 60;
      const eta = new Date(now.getTime() + totalMin * 60000);
      const eh  = String(eta.getHours()).padStart(2,'0');
      const em  = String(eta.getMinutes()).padStart(2,'0');
      const left = rh > 0
        ? `${rh}h${String(rm).padStart(2,'0')}m`
        : `${rm}m`;
      etaEl.textContent = `剩 ${left} → ${eh}:${em}`;
    }
  }
  tick();
  setInterval(tick, 1000);
})();

// ── Dark mode ─────────────────────────────────────────────────────────────────
const THEME_ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const THEME_ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const themeBtn = document.getElementById('theme-btn');

function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeBtn.innerHTML = dark ? THEME_ICON_SUN : THEME_ICON_MOON;
  localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
}

const savedTheme = localStorage.getItem(THEME_KEY);
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
});

// ── Fullscreen (F key / middle click / clock click) ──────────────────────────
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}
document.addEventListener('keydown', e => {
  if ((e.key === 'f' || e.key === 'F') &&
      document.activeElement !== document.getElementById('search-input')) {
    toggleFullscreen();
  }
});
document.addEventListener('auxclick', e => {
  if (e.button === 1) { e.preventDefault(); toggleFullscreen(); }
});
document.getElementById('clock').addEventListener('click', toggleFullscreen);

// ── Init ──────────────────────────────────────────────────────────────────────
updateProgress();
updateWrongLabel();
render();
</script>
